name: fss_example
description: Simple test application and examples for fss styling
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.2.0"

dependencies:
  flutter:
    sdk: flutter
  fss:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: 2.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: StyleScript
      fonts:
        - asset: assets/StyleScript-Regular.ttf
          style: normal